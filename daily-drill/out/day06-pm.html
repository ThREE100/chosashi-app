<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第6日 夜 問題</title><style>

.lines{background-image:repeating-linear-gradient(#fff 0,#fff 7.4mm,var(--line) 7.4mm,var(--line) 7.9mm);border:1px solid var(--line);}
.pt{width:100%;border-collapse:collapse;margin:1mm 0 2mm;font-size:10pt}

.clz{border:1px solid var(--line);padding:3mm 4mm;margin:2mm 0}
.cl{margin:0 0 2.2mm;font-size:10.5pt;line-height:1.95}

.figrow{margin:2mm 0}
.figrow svg.fig{display:block;width:100%;height:auto}
.coord{margin-top:2mm}
.coord table{width:100%;border-collapse:collapse;font-size:10pt}
.coord th,.coord td{border:1px solid var(--line);padding:.9mm 2mm;text-align:right;white-space:nowrap}
.coord th{background:var(--soft);font-weight:500;text-align:center}
.coord td.n{text-align:center;font-weight:700}
.coord p{margin:1.2mm 0 0;font-size:9.5pt;color:var(--mute);line-height:1.5}
code{font-family:"Space Mono",Menlo,monospace;font-size:9.5pt}
@page{size:A4;margin:0}
@media print{html{background:#fff}.sheet{margin:0;box-shadow:none;page-break-after:always;break-after:page;overflow:hidden;height:297mm}.sheet.flow{height:auto;overflow:visible}}
</style></head><body><div class="sheet"><div class="hd"><h1>第6日　夜：記述式ドリル</h1><span class="meta">日付：　　月　　日　／　目安 15分　／　時間：　　分</span></div><p class="theme">四角形の面積（対角線の式）と地積</p><h2>問題</h2><p>次の4点で囲まれた四角形ABCDの土地（地目は宅地）がある。座標は、Xが北、Yが東である。答えは、小数第3位を四捨五入して小数第2位まで書く（面積の問題を除く）。</p><div class="figrow"><svg class="fig" viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Noto Sans JP, Hiragino Sans, Yu Gothic, Meiryo, sans-serif"><rect x="2" y="2" width="996" height="696" fill="#fff" stroke="#cfd8d4" stroke-width="3" rx="14"/><polygon points="73.5,588.6 70.0,82.0 850.0,76.4 685.8,566.9" fill="#e8f4f0" stroke="#1d2b27" stroke-width="4" stroke-linejoin="round"/><line x1="73.5" y1="588.6" x2="850.0" y2="76.4" stroke="#7a8782" stroke-width="3" stroke-dasharray="14 9" stroke-linecap="round"/><line x1="70.0" y1="82.0" x2="685.8" y2="566.9" stroke="#7a8782" stroke-width="3" stroke-dasharray="14 9" stroke-linecap="round"/><circle cx="73.5" cy="588.6" r="9" fill="#1d2b27"/><text x="87.5" y="574.6" font-size="34" fill="#1d2b27" font-weight="700" text-anchor="start" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">A</text><circle cx="70.0" cy="82.0" r="9" fill="#1d2b27"/><text x="84.0" y="68.0" font-size="34" fill="#1d2b27" font-weight="700" text-anchor="start" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">B</text><circle cx="850.0" cy="76.4" r="9" fill="#1d2b27"/><text x="864.0" y="62.4" font-size="34" fill="#1d2b27" font-weight="700" text-anchor="start" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">C</text><circle cx="685.8" cy="566.9" r="9" fill="#1d2b27"/><text x="699.8" y="552.9" font-size="34" fill="#1d2b27" font-weight="700" text-anchor="start" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">D</text><text x="419.8" y="338.5" font-size="34" fill="#7a8782" font-weight="700" text-anchor="middle" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">宅地</text><g><line x1="930" y1="170" x2="930" y2="110" stroke="#1d2b27" stroke-width="4"/><polygon points="930,96 919,124 941,124" fill="#1d2b27"/><text x="930" y="86" font-size="32" font-weight="700" text-anchor="middle" fill="#1d2b27" stroke="#fff" stroke-width="6" paint-order="stroke">北</text></g></svg><div class="coord"><table><tr><th>点</th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><th>X（北）</th><td>247.03</td><td>268.66</td><td>268.90</td><td>247.96</td></tr><tr><th>Y（東）</th><td>111.28</td><td>111.13</td><td>144.43</td><td>137.42</td></tr></table></div></div><h2>求めるもの</h2><p class="q">（1）四角形ABCD（A→B→C→Dの順に時計回り）の面積を求め、宅地の地積として答えなさい</p><p>地積 ＝ <span class="box" style="min-width:34mm"></span> ㎡</p><div class="foot"><span>PM-06</span><span></span></div></div></body></html>
