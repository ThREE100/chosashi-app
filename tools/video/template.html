<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<!--
  解説動画の画面（1920×1080。YouTube の標準の 16:9）。レイアウトの数値は tools/video/YOUTUBE_VISUAL_SPEC.md を参照。
    ヘッダー  y 0〜64
    図の枠    x 240〜1680 / y 72〜882（1440×810 = 16:9。図はこの枠に合わせて描く・拡大する）
    字幕      x 240〜1680 / y 912〜1060（2行・44px）
    キャラ    左（藍子）x 0〜250 / 右（トリ先生）x 1670〜1920。字幕の下端にそろえる
  文字の大きさの下限（実寸）: 字幕44px・図の中の注釈40px・カードの見出し38px・カードの本文34px。28px未満は使わない。
-->
<style>
  :root { --navy:#1e3a8a; --tori:#c2410c; --red:#c62828; --blue:#1565c0; --green:#2e7d32; --orange:#e65100; --gray:#546e7a;
          --bg1:#eef4fb; --bg2:#fdf6ec; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:1920px; height:1080px; overflow:hidden;
    font-family:"Noto Sans CJK JP","Noto Sans JP","IPAPGothic","IPAGothic",sans-serif; color:#0f172a; }
  body { background:linear-gradient(160deg,var(--bg1),var(--bg2)); position:relative; }
  #header { position:absolute; left:0; top:0; width:100%; height:64px; background:var(--navy); color:#fff;
    display:flex; align-items:center; padding:0 48px; gap:28px; }
  #series { font-size:28px; opacity:.85; white-space:nowrap; }
  #chapter { font-size:34px; font-weight:bold; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  #stage { position:absolute; left:240px; top:72px; width:1440px; height:810px; background:#fff; border-radius:18px;
    box-shadow:0 6px 24px #0f172a22; overflow:hidden; }
  .layer { position:absolute; left:0; top:0; width:1440px; height:810px; }
  .imgwrap { position:absolute; }
  .imgwrap img { width:100%; height:100%; display:block; }
  .focus { position:absolute; border:7px solid var(--red); border-radius:14px; box-shadow:0 0 0 6px #ffffffcc, 0 0 22px 6px #c6282877; }
  .callout { position:absolute; max-width:900px; padding:14px 28px; border-radius:16px; background:#fff; border:6px solid var(--red);
    font-size:42px; font-weight:bold; line-height:1.35; color:var(--red); box-shadow:0 6px 18px #0f172a33; white-space:pre-line; }
  .callout.blue { border-color:var(--blue); color:var(--blue); } .callout.green { border-color:var(--green); color:var(--green); }
  .callout.gray { border-color:var(--gray); color:var(--gray); } .callout.navy { border-color:var(--navy); color:var(--navy); }
  .callout.tl { left:28px; top:24px; } .callout.tr { right:28px; top:24px; } .callout.bl { left:28px; bottom:24px; }
  .callout.br { right:28px; bottom:24px; } .callout.tc { left:50%; top:24px; transform:translateX(-50%); }
  .callout.bc { left:50%; bottom:24px; transform:translateX(-50%); }

  /* 箇条書き */
  .bullets { position:absolute; inset:0; padding:56px 80px; }
  .bullets h2 { font-size:54px; color:var(--navy); margin-bottom:30px; border-left:14px solid var(--navy); padding-left:22px; }
  .bullets li { font-size:48px; line-height:1.5; margin:16px 0 16px 1.3em; transition:none; }
  /* タイトルカード */
  .titlecard { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .titlecard .t1 { font-size:38px; color:#475569; margin-bottom:26px; }
  .titlecard .t2 { font-size:84px; font-weight:bold; color:var(--navy); line-height:1.3; }
  .titlecard .t3 { font-size:46px; color:var(--tori); margin-top:30px; }
  /* カードの一覧（cards） */
  .cards { position:absolute; inset:0; padding:28px 36px; display:grid; gap:22px; align-content:center; }
  .cards.c1 { grid-template-columns:1fr; } .cards.c2 { grid-template-columns:1fr 1fr; } .cards.c3 { grid-template-columns:1fr 1fr 1fr; }
  .cards .ttl { grid-column:1 / -1; font-size:48px; font-weight:bold; color:var(--navy); text-align:center; }
  .cardx.span2 { grid-column:1 / -1; }
  .cardx { border:6px solid var(--gray); border-radius:18px; padding:20px 26px; background:#f8fafc; }
  .cardx h3 { font-size:42px; margin-bottom:12px; line-height:1.25; }
  .cardx li { font-size:36px; line-height:1.4; margin:7px 0 7px 1.1em; }
  .cardx p { font-size:36px; line-height:1.4; }
  .cards.big .cardx h3 { font-size:52px; margin-bottom:18px; }
  .cards.big .cardx li { font-size:42px; margin:10px 0 10px 1.1em; }
  .cards.big .cardx p { font-size:42px; }
  .cards.big .ttl { font-size:56px; }
  .cardx.red { border-color:var(--red); background:#fdecea; } .cardx.red h3 { color:var(--red); }
  .cardx.blue { border-color:var(--blue); background:#e8f1fb; } .cardx.blue h3 { color:var(--blue); }
  .cardx.green { border-color:var(--green); background:#e8f5e9; } .cardx.green h3 { color:var(--green); }
  .cardx.orange { border-color:var(--orange); background:#fff3e0; } .cardx.orange h3 { color:var(--orange); }
  .cardx.gray h3 { color:var(--gray); }
  /* 縦の時系列・表（rows） */
  .rows { position:absolute; inset:0; padding:30px 56px; display:flex; flex-direction:column; justify-content:center; gap:10px; }
  .rows .ttl { font-size:48px; font-weight:bold; color:var(--navy); text-align:center; margin-bottom:10px; }
  .row { display:flex; align-items:center; gap:24px; border-left:12px solid var(--gray); background:#f1f5f9; border-radius:10px; padding:10px 24px; }
  .row .k { flex:0 0 400px; font-size:38px; font-weight:bold; color:var(--gray); }
  .row .v { font-size:40px; line-height:1.3; }
  .rows.big { gap:16px; } .rows.big .ttl { font-size:58px; margin-bottom:20px; }
  .rows.big .row { padding:20px 30px; } .rows.big .row .k { font-size:48px; flex-basis:430px; } .rows.big .row .v { font-size:52px; }
  .row.red { border-color:var(--red); background:#fdecea; } .row.red .k { color:var(--red); }
  .row.blue { border-color:var(--blue); background:#e8f1fb; } .row.blue .k { color:var(--blue); }
  .row.green { border-color:var(--green); background:#e8f5e9; } .row.green .k { color:var(--green); }
  .cards.hc, .rows.hc { padding-bottom:190px; } .bullets.hc { padding-bottom:200px; }
  .hid { visibility:hidden; }
  .dimx { opacity:.28; }
  .on { outline:8px solid #ffb300; outline-offset:4px; }

  #sub { position:absolute; left:240px; top:912px; width:1440px; height:148px; background:#ffffffee; border-radius:20px;
    border:5px solid var(--navy); padding:14px 36px 10px; font-size:44px; line-height:1.4; display:flex; align-items:center; }
  #sub.tori { border-color:var(--tori); }
  #name { position:absolute; left:28px; top:-27px; background:var(--navy); color:#fff; font-size:30px; font-weight:bold;
    padding:2px 24px; border-radius:30px; line-height:1.4; }
  #sub.tori #name { background:var(--tori); }
  #sub.hidden { display:none; }
  .chara { position:absolute; bottom:20px; width:250px; height:330px; }
  .chara svg, .chara img { width:100%; height:100%; object-fit:contain; object-position:center bottom; }
  #c-left { left:0; } #c-right { right:0; }
  .dim { opacity:.55; filter:saturate(.6); }
</style></head>
<body>
  <div id="header"><div id="series"></div><div id="chapter"></div></div>
  <div id="stage"></div>
  <div id="c-left" class="chara"></div>
  <div id="c-right" class="chara"></div>
  <div id="sub"><div id="name"></div><div id="text"></div></div>
<script>
  const SW = 1440, SH = 810;
  // 字幕: 「2番58」「10月19日」「第72条第1項」のような番号・日付は、途中で折り返さない
  function subHtml(s){
    return esc(s).replace(/(第?[0-9A-Za-z.,・＝=]+(?:[番条項号目年月日個件点円㎡％%倍分秒度]+[0-9.]*)*)/g, '<span style="white-space:nowrap">$1</span>');
  }
  function esc(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

  // 画像の図を、表示範囲 view=[x0,y0,x1,y1]（画像に対する0〜1）が図の枠いっぱいに入るように置く
  function imageLayer(s, alpha){
    const v = s.view || [0,0,1,1];
    const vw = (v[2]-v[0]) * s.nw, vh = (v[3]-v[1]) * s.nh;
    const k = Math.min(SW/vw, SH/vh);
    const W = s.nw*k, H = s.nh*k;
    const L = SW/2 - ((v[0]+v[2])/2*s.nw)*k, T = SH/2 - ((v[1]+v[3])/2*s.nh)*k;
    let h = `<div class="imgwrap" style="left:${L}px;top:${T}px;width:${W}px;height:${H}px"><img src="${s.src}"></div>`;
    for (const f of (s.focus || [])) {
      const b = f.box || f;
      h += `<div class="focus" style="opacity:${alpha};left:${L+b[0]*W}px;top:${T+b[1]*H}px;width:${(b[2]-b[0])*W}px;height:${(b[3]-b[1])*H}px"></div>`;
    }
    return h;
  }
  function calloutHtml(c, alpha){
    if (!c) return '';
    return `<div class="callout ${c.color||''} ${c.pos||'br'}" style="opacity:${alpha}">${esc(c.text)}</div>`;
  }
  // reveal: 先頭から何個まで見せるか。focus: 強調する番号（0始まり）。見せていないものは場所だけ残す
  function itemClass(i, s){
    let c = '';
    if (s.reveal !== undefined && s.reveal !== null && i >= s.reveal) c += ' hid';
    if (s.focus_item !== undefined && s.focus_item !== null && !(Array.isArray(s.focus_item) ? s.focus_item.includes(i) : s.focus_item === i)) c += ' dimx';
    return c;
  }
  function layerHtml(s, alpha){
    const k = s.kind;
    if (k === 'image') return imageLayer(s, alpha) + calloutHtml(s.callout, alpha);
    if (k === 'bullets') return `<div class="bullets${s.callout ? ' hc' : ''}">${s.heading?`<h2>${esc(s.heading)}</h2>`:''}<ul>${s.items.map((t,i)=>`<li class="${itemClass(i,s)}">${esc(t)}</li>`).join('')}</ul></div>` + calloutHtml(s.callout, alpha);
    if (k === 'card') return `<div class="titlecard"><div class="t1">${esc(s.top||'')}</div><div class="t2">${esc(s.title||'').replace(/\n/g,'<br>')}</div><div class="t3">${esc(s.bottom||'')}</div></div>`;
    if (k === 'cards') {
      const cols = s.cols || Math.min(3, s.cards.length);
      return `<div class="cards c${cols}${s.cards.length <= 2 ? ' big' : ''}${s.callout ? ' hc' : ''}">${s.title?`<div class="ttl">${esc(s.title)}</div>`:''}` + s.cards.map((c,i)=>
        `<div class="cardx ${c.color||'gray'}${c.span ? ' span2' : ''}${itemClass(i,s)}"><h3>${esc(c.head)}</h3>` +
        (c.items ? `<ul>${c.items.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>` : '') + (c.text ? `<p>${esc(c.text).replace(/\n/g,'<br>')}</p>` : '') + `</div>`).join('') + `</div>` + calloutHtml(s.callout, alpha);
    }
    if (k === 'rows') {
      return `<div class="rows${s.rows.length <= 5 ? ' big' : ''}${s.callout ? ' hc' : ''}">${s.title?`<div class="ttl">${esc(s.title)}</div>`:''}` + s.rows.map((r,i)=>
        `<div class="row ${r.color||''}${itemClass(i,s)}"><div class="k">${esc(r.k)}</div><div class="v">${esc(r.v)}</div></div>`).join('') + `</div>` + calloutHtml(s.callout, alpha);
    }
    if (k === 'html') return s.html + calloutHtml(s.callout, alpha);
    return '';
  }
  // 画面の点検: 図の枠からはみ出した要素・字幕が3行以上になっていないかを返す
  window.problems = function(){
    const out = [], st = document.getElementById('stage').getBoundingClientRect();
    document.querySelectorAll('#stage .cardx, #stage .row, #stage .bullets li, #stage .bullets h2, #stage .callout, #stage .ttl, #stage .titlecard div').forEach(e => {
      const r = e.getBoundingClientRect();
      if (r.bottom > st.bottom + 1 || r.right > st.right + 1 || r.left < st.left - 1 || r.top < st.top - 1)
        out.push('図の枠からはみ出し: ' + (e.className || e.tagName) + ' 「' + (e.textContent || '').slice(0, 18) + '」');
    });
    // 注釈（callout）が、表・カード・箇条書きの文字に重なっていないか（画像の図は、図の文字との重なりを check_shots.py が見る）
    const texts = Array.from(document.querySelectorAll('#stage .row, #stage .cardx, #stage .bullets li, #stage .bullets h2, #stage .ttl'))
      .filter(e => getComputedStyle(e).visibility !== 'hidden');
    document.querySelectorAll('#stage .callout').forEach(c => {
      const a = c.getBoundingClientRect();
      for (const e of texts) {
        const b = e.getBoundingClientRect();
        if (Math.min(a.right, b.right) - Math.max(a.left, b.left) > 6 && Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top) > 6) {
          out.push('注釈が文字に重なっている: 「' + (c.textContent || '').slice(0, 12) + '」と「' + (e.textContent || '').slice(0, 12) + '」'); break;
        }
      }
    });
    const sub = document.getElementById('sub'), tx = document.getElementById('text');
    if (sub.className !== 'hidden' && tx.getBoundingClientRect().height > 44 * 1.4 * 2 + 4) out.push('字幕が3行以上: 「' + tx.textContent.slice(0, 18) + '」');
    return out;
  };
  // state: {series, chapter, stage, prev, fade, ui, left, right, sub}
  //   prev があれば、prev を下に敷いて stage を fade（0〜1）の濃さで重ねる（図の切り替え）
  window.setState = function(st){
    document.getElementById('series').textContent = st.series || '';
    document.getElementById('chapter').textContent = st.chapter || '';
    const stage = document.getElementById('stage');
    const s = st.stage || {kind:'none'};
    let h = '';
    if (st.prev) h += `<div class="layer">${layerHtml(st.prev, 1)}</div>`;
    const f = (st.fade === undefined || st.fade === null) ? 1 : st.fade;
    h += `<div class="layer" style="opacity:${st.prev ? f : 1}">${layerHtml(s, (st.ui === undefined || st.ui === null) ? 1 : st.ui)}</div>`;
    stage.innerHTML = h;
    for (const side of ['left','right']) {
      const el = document.getElementById('c-'+side), c = st[side];
      el.innerHTML = c ? c.html : '';
      el.className = 'chara' + (c && c.dim ? ' dim' : '');
    }
    const sub = document.getElementById('sub');
    if (st.sub) {
      sub.className = st.sub.cls || '';
      document.getElementById('name').textContent = st.sub.name;
      document.getElementById('text').innerHTML = subHtml(st.sub.text);
    } else sub.className = 'hidden';
  };
</script>
</body></html>
