<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#fbf8f1;font-family:"Noto Sans CJK JP";color:#1f2d3d}
.wrap{width:1080px;height:1440px;box-sizing:border-box;padding:72px 54px;display:flex;flex-direction:column}
h1{font-size:50px;margin:0 0 10px;line-height:1.3} .sub{font-size:30px;color:#55606e;margin-bottom:28px;line-height:1.5}

.bw{flex:1;height:38px;position:relative} .all{position:absolute;left:0;top:0;height:100%;background:#e0dacd;border-radius:8px}
.deep{position:absolute;left:0;top:0;height:100%;border-radius:8px;min-width:0}
.v{width:170px;text-align:right;font-size:32px;flex:none} .v b{font-size:40px}
.leg{margin-top:26px;font-size:28px;color:#55606e;line-height:1.7} .sw{display:inline-block;width:22px;height:22px;border-radius:4px;vertical-align:-4px;margin:0 6px 0 0}
</style></head><body><div class="wrap"><h1>法令ごとの「広く浅い」と「狭く深い」</h1>

<div class="rows"><div class="row"><div class="nm">不動産登記法</div>
<div class="bw"><div class="all" style="width:54.2%"></div><div class="deep" style="width:9.0%;background:#3b78c2"></div></div>

<div class="bw"><div class="all" style="width:100.0%"></div><div class="deep" style="width:2.4%;background:#e8a05c"></div></div>

<div class="bw"><div class="all" style="width:6.0%"></div><div class="deep" style="width:0.0%;background:#3b78c2"></div></div>

<div class="bw"><div class="all" style="width:24.7%"></div><div class="deep" style="width:0.0%;background:#3b78c2"></div></div>
