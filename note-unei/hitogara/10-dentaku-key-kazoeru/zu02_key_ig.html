</style></head><body><div class="wrap"><h1>いちばん押したキー</h1><div class="sub">19年度分の合計で、多く押したキーの上位10</div><div><div class="row"><div class="nm">数字・小数点</div><div class="bw"><div class="bar" style="width:100.0%;background:#e8a05c"></div></div><div class="v"><b>3992</b>回</div></div><div class="row"><div class="nm">[ALPHA]</div><div class="bw"><div class="bar" style="width:29.5%;background:#3b78c2"></div></div><div class="v"><b>1176</b>回</div></div><div class="row"><div class="nm">[)]</div><div class="bw"><div class="bar" style="width:16.8%;background:#3b78c2"></div></div><div class="v"><b>669</b>回</div></div><div class="row"><div class="nm">[+]</div><div class="bw"><div class="bar" style="width:13.5%;background:#3b78c2"></div></div><div class="v"><b>539</b>回</div></div><div class="row"><div class="nm">[−]</div><div class="bw"><div class="bar" style="width:11.7%;background:#3b78c2"></div></div><div class="v"><b>467</b>回</div></div><div class="row"><div class="nm">[Apps]</div><div class="bw"><div class="bar" style="width:8.3%;background:#3b78c2"></div></div><div class="v"><b>330</b>回</div></div><div class="row"><div class="nm">[=]</div><div class="bw"><div class="bar" style="width:7.9%;background:#3b78c2"></div></div><div class="v"><b>315</b>回</div></div><div class="row"><div class="nm">[4]</div><div class="bw"><div class="bar" style="width:7.6%;background:#3b78c2"></div></div><div class="v"><b>302</b>回</div></div><div class="row"><div class="nm">[i]</div><div class="bw"><div class="bar" style="width:7.3%;background:#3b78c2"></div></div><div class="v"><b>290</b>回</div></div><div class="row"><div class="nm">[(]</div><div class="bw"><div class="bar" style="width:5.9%;background:#3b78c2"></div></div><div class="v"><b>234</b>回</div></div></div><div class="foot">［ALPHA］はメモリの呼び出し、［SHIFT］［STO］はメモリへの記憶、［Apps］は複素数の関数（arg・Conjg）を呼ぶキー。</div></div></body></html>
