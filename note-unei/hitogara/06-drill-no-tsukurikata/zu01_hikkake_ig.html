<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fbf8f1;font-family:"Noto Sans CJK JP";color:#1f2d3d}
.wrap{width:1080px;box-sizing:border-box;padding:72px 54px;display:flex;flex-direction:column;transform-origin:top left}
h1{font-size:42px;margin:0 0 8px;line-height:1.3} .sub{font-size:23px;color:#55606e;margin-bottom:20px;line-height:1.5}
.foot{margin-top:16px;font-size:20px;color:#55606e;line-height:1.6}
table{border-collapse:collapse;width:100%;font-size:26px;line-height:1.4;background:#fff}
th{background:#1d4f91;color:#fff;font-weight:700;padding:8px 10px;text-align:left}
td{border-bottom:1px solid #e3dccd;padding:7px 10px;vertical-align:top} tr.hl td{background:#fff4e6}
td.c{text-align:center} td b{color:#1d4f91}
.row{display:flex;align-items:center;gap:14px;margin:7px 0}
.nm{width:470px;font-size:26px;font-weight:700;flex:none;line-height:1.3} .nm small{display:block;font-size:18px;color:#7a7266;font-weight:400}
.bw{flex:1;height:28px;background:#eee8dc;border-radius:8px} .bar{height:100%;border-radius:8px}
.v{width:130px;text-align:right;font-size:26px;flex:none} .v b{font-size:30px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:#fff;border:2px solid #3b78c2;border-radius:14px;padding:12px 16px} .card.o{border-color:#e8a05c;background:#fff8ef} .card.g{border-color:#b9b2a4}
.k{font-size:27px;font-weight:700;color:#1d4f91;margin-bottom:4px} .card.o .k{color:#a8561a}
ul{margin:0;padding-left:1.1em;font-size:23px;line-height:1.5}
</style></head><body><div class="wrap"><h1>朝の択一120問に使った、ひっかけの型</h1><div class="sub">毎朝ドリルの朝の択一120問で、誤りの肢を作るときに使った型の数（1問に2〜5個。登録簿から数えた）</div><div><div class="row"><div class="nm">規則・準則・先例の知識<small>M7</small></div><div class="bw"><div class="bar" style="width:100.0%;background:#3b78c2"></div></div><div class="v"><b>72</b>問</div></div><div class="row"><div class="nm">事例の当てはめ<small>M4</small></div><div class="bw"><div class="bar" style="width:98.6%;background:#3b78c2"></div></div><div class="v"><b>71</b>問</div></div><div class="row"><div class="nm">似た制度・用語の取り違え<small>M8</small></div><div class="bw"><div class="bar" style="width:93.1%;background:#3b78c2"></div></div><div class="v"><b>67</b>問</div></div><div class="row"><div class="nm">例外・但書の見落とし<small>M3</small></div><div class="bw"><div class="bar" style="width:90.3%;background:#3b78c2"></div></div><div class="v"><b>65</b>問</div></div><div class="row"><div class="nm">範囲のすり替え（全部／一部、直接／間接）<small>M6</small></div><div class="bw"><div class="bar" style="width:88.9%;background:#3b78c2"></div></div><div class="v"><b>64</b>問</div></div><div class="row"><div class="nm">主体のすり替え（誰が申請・誰の義務）<small>M2</small></div><div class="bw"><div class="bar" style="width:51.4%;background:#3b78c2"></div></div><div class="v"><b>37</b>問</div></div><div class="row"><div class="nm">手続の期間・起算日・順序<small>M5</small></div><div class="bw"><div class="bar" style="width:45.8%;background:#3b78c2"></div></div><div class="v"><b>33</b>問</div></div><div class="row"><div class="nm">数字のすり替え（期間・割合）<small>M1</small></div><div class="bw"><div class="bar" style="width:31.9%;background:#3b78c2"></div></div><div class="v"><b>23</b>問</div></div><div class="row"><div class="nm">義務と努力義務<small>M10</small></div><div class="bw"><div class="bar" style="width:4.2%;background:#3b78c2"></div></div><div class="v"><b>3</b>問</div></div></div><div class="foot">同じ問で同じ型を2つの肢に使っても1と数えた。M9は欠番。</div></div></body></html>
