                  transform: rotate(-3deg); }
.red { color: #d0021b; font-family: "Noto Sans CJK JP", "IPAGothic", sans-serif; font-weight: bold; }
.bubble { display: inline-block; position: relative; border: 2.5px solid #d0021b; border-radius: 14px;

.good { outline: 3px solid #2e9e44; outline-offset: 4px; background: #f1faf2; }
