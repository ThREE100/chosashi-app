<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>

.panel { padding: 26px 60px 30px; border-bottom: 2px solid #bbb; }

</style></head><body><div class="page"><div class="sec">第2欄</div><div class="kijutsu"><span class="ink">新館は、既存建物との間が木製のドアで仕切られているので構造上の独立性はあるが、勝手口等がなく、道路等への出入りに既存建物の2階の居間と1階の玄関を通らなければならないので、利用上の独立性がない。したがって新館は区分建物にならず、既存建物と1個の建物となるので、一不動産一登記記録の原則により、新館と渡り廊下を既存建物の増築として、既存建物の建物表題部変更登記を申請した。</span></div>
<div class="caption">平成28年度 土地家屋調査士試験 第22問 問2（第2欄）解答例</div></div></body></html>
