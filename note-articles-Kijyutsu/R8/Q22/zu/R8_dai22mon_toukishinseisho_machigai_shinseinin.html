<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #fff; width: 1200px; font-family: "Noto Serif CJK JP", "IPAMincho", serif; color: #111; }

table.t td.e { height: 92px; }
table.t td.c { text-align: center; }

table.t td.dec { vertical-align: bottom; text-align: left; border-left: 1.5px dashed #555; padding-left: 4px; }
table.t td .ink { font-size: 20px; }
table.t td.g .ink { font-size: 18px; }
.note { font-family: "Noto Sans CJK JP", "IPAGothic", sans-serif; font-size: 16px; color: #555; margin: -16px 0 22px; }
td.note2 { font-family: "Noto Sans CJK JP", "IPAGothic", sans-serif; font-size: 14px !important; color: #555; }
.ryk { color: #888; font-size: 15px; }
.ranlab { font-family: "Noto Sans CJK JP", "IPAGothic", sans-serif; font-weight: bold; font-size: 24px; margin-bottom: 14px; }
.colsep { font-family: "Noto Sans CJK JP", "IPAGothic", sans-serif; color: #888; font-size: 16px; border-top: 2px dashed #aaa; padding-top: 6px; margin: 10px 0 18px; }
.caption { text-align: center; font-size: 17px; color: #555; margin-top: 24px; font-family: "Noto Sans CJK JP", "IPAGothic", sans-serif; }
.panel { padding: 26px 60px 30px; border-bottom: 2px solid #bbb; }
.ptitle { font-family: "Noto Sans CJK JP", "IPAGothic", sans-serif; font-size: 28px; font-weight: bold; margin-bottom: 20px; }
.ptitle.ng { color: #555; } .ptitle.fix { color: #d0021b; } .ptitle.ok { color: #2e9e44; }
.strike { text-decoration: line-through; text-decoration-color: #d0021b; text-decoration-thickness: 3px; }
.red { color: #d0021b; font-family: "Noto Sans CJK JP", "IPAGothic", sans-serif; font-weight: bold; }
.bubble { display: inline-block; border: 2.5px solid #d0021b; border-radius: 14px; padding: 8px 18px; color: #d0021b;

.bubrow { margin: 14px 0 0; text-align: right; }
.bubrow .bubble { text-align: left; }
.good { outline: 3px solid #2e9e44; outline-offset: 4px; background: #f1faf2; }
.tall { min-height: 1300px; display: flex; flex-direction: column; justify-content: space-around; }
