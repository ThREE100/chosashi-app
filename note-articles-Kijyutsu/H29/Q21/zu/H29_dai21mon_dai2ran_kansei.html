</style></head><body><div class="ran"><h2>第２欄　地積の更正の登記を申請することの要否及びその理由について</h2><table class="ans"><tr><td class="lab">地積の更正の登記を申請することの要否</td></tr><tr><td class="long"><span class="ink">地積の更正の登記を申請する必要がある</span></td></tr><tr><td class="lab">要否の理由</td></tr><tr><td class="long" style="height:190px;vertical-align:top"><span class="ink">対象土地は市街地地域に属するので、地積測量図の誤差の限度は精度区分甲2までである。合筆後の分筆前の地積297.52㎡を基準にした公差は1.57㎡であり、分筆後の地積の合計299.84㎡との差2.32㎡は、この公差を超えるため（不動産登記事務取扱手続準則第72条第1項）</span></td></tr></table><div class="caption">平成29年度 土地家屋調査士試験 第21問 第2欄（問2）解答例</div></div></body></html>
