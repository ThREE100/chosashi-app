<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #fff; width: 1200px; font-family: "Noto Serif CJK JP", "IPAMincho", serif; color: #111; }
.page { padding: 80px 70px 40px; min-height: 1650px; display: flex; flex-direction: column; }
.page .caption { margin-top: auto; padding-top: 30px; }
.title { text-align: center; font-size: 40px; letter-spacing: 0.9em; margin: 0 0 56px 0.9em; }
.row { display: flex; align-items: flex-start; margin-bottom: 32px; }
.lab { width: 170px; font-size: 22px; padding-top: 10px; white-space: nowrap; }
.box { flex: 1; border: 2px solid #111; padding: 10px 16px; font-size: 26px; line-height: 1.6; }
.box.m19 { min-height: 125px; }
.box.m27 { min-height: 178px; }
.ink { color: #1a3a8f; font-family: "Noto Sans CJK JP", "IPAGothic", sans-serif; }
.plain { font-size: 22px; margin: 4px 0 26px; }
.dairi { display: flex; font-size: 22px; margin-bottom: 26px; }
.dairi .lab { padding-top: 0; }
.dairi .ryaku { flex: 1; text-align: center; }
table.land { width: 100%; border-collapse: collapse; border: 3px solid #111; table-layout: fixed; }
table.land td { border: 1.5px solid #111; font-size: 22px; padding: 0 12px; height: 137px; vertical-align: middle; white-space: nowrap; }
table.land td.vert, table.land td:last-child { white-space: normal; }
table.land td.head { height: 50px; text-align: center; font-size: 20px; }
table.land td.vert { writing-mode: vertical-rl; text-align: center; letter-spacing: 0.9em; padding: 0; font-size: 22px; }
table.land td.shozai-lab { text-align: center; height: 112px; }
table.land.few td.vert { letter-spacing: 0.12em; font-size: 20px; }
table.land td.int { text-align: right; border-right: 1.5px dashed #555; padding-right: 6px; }
table.land td.dec { text-align: left; border-left: 1.5px dashed #555; padding-left: 6px; }
table.land td.chimoku { text-align: center; }
table.land td .ink, .box .ink { font-size: 26px; }
table.land td:last-child .ink { font-size: 23px; line-height: 1.5; }
table.land td .red { font-size: 23px; }
.caption { text-align: center; font-size: 17px; color: #555; margin-top: 30px;
            font-family: "Noto Sans CJK JP", "IPAGothic", sans-serif; }
/* 添削画像 */
.panel { padding: 70px 70px 76px; border-bottom: 2px solid #bbb; }
.panel:last-of-type { border-bottom: none; }
.ptitle { font-family: "Noto Sans CJK JP", "IPAGothic", sans-serif; font-size: 28px; font-weight: bold;
           margin-bottom: 20px; }
.ptitle.ng { color: #555; } .ptitle.fix { color: #d0021b; } .ptitle.ok { color: #2e9e44; }
.strike { position: relative; }
.strike::after { content: ""; position: absolute; left: -4px; right: -4px; top: 52%; border-top: 3px solid #d0021b;
                  transform: rotate(-2deg); }
.red { color: #d0021b; font-family: "Noto Sans CJK JP", "IPAGothic", sans-serif; }
.bubble { display: inline-block; position: relative; border: 2.5px solid #d0021b; border-radius: 14px;
           padding: 8px 18px; color: #d0021b; font-size: 22px; font-weight: bold; background: #fff5f5;
           font-family: "Noto Sans CJK JP", "IPAGothic", sans-serif; }
.bubble::before { content: ""; position: absolute; top: -16px; left: 60px; border: 8px solid transparent;
                   border-bottom: 8px solid #d0021b; }
.bubrow { margin: -12px 0 24px 170px; }
.bubrow.tbl { margin: 14px 0 6px 60px; }
.good { outline: 3px solid #2e9e44; outline-offset: 4px; border-radius: 2px; background: #f1faf2; }
.okrow { position: relative; }
.check { position: absolute; right: -8px; top: -30px; }
.tblwrap { position: relative; }
.tblwrap .check { right: -14px; top: -26px; }
</style></head><body>
<div class="panel"><div class="ptitle ng">①誤答</div><div class="row okrow"><div class="lab">登録免許税</div><div class="box m19"><span class="ink">金2,000円</span></div></div></div>
<div class="panel"><div class="ptitle fix">②添削（赤ペン）</div><div class="row okrow"><div class="lab">登録免許税</div><div class="box m19"><span class="ink strike">金2,000円</span><br><span class="red">金3,000円</span></div></div><div class="bubrow"><span class="bubble">分筆後の土地の個数（184番1・3・4の3個）× 1,000円</span></div></div>
<div class="panel"><div class="ptitle ok">③正解</div><div class="row okrow"><div class="lab">登録免許税</div><div class="box m19 good"><span class="ink">金3,000円</span></div><svg class="check" width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="20" fill="#fff" stroke="#2e9e44" stroke-width="3"/><path d="M11 23 L19 31 L33 14" fill="none" stroke="#2e9e44" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
<div class="caption" style="margin:10px 0 30px">令和4年度 第21問｜登録免許税は分筆後の個数</div></body></html>
