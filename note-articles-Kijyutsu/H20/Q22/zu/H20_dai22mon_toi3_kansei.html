<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #fff; width: 1200px; font-family: "Noto Serif CJK JP", "IPAMincho", serif; color: #111; }

table.t td.genin { font-size: 17px; }

.toi3 { font-size: 22px; margin: 0 0 14px; }

.after { font-size: 17px; color: #555; margin-top: 14px; font-family: "Noto Sans CJK JP", "IPAGothic", sans-serif; }

.panel { padding: 26px 60px 30px; border-bottom: 2px solid #bbb; }
.ptitle { font-family: "Noto Sans CJK JP", "IPAGothic", sans-serif; font-size: 28px; font-weight: bold;

.ptitle.ng { color: #555; } .ptitle.fix { color: #d0021b; } .ptitle.ok { color: #2e9e44; }
.dstrike { position: relative; }
.dstrike::before, .dstrike::after { content: ""; position: absolute; left: -3px; right: -3px; border-top: 2.5px solid #d0021b; }
.dstrike::before { top: 42%; } .dstrike::after { top: 60%; }
.redfix { color: #d0021b; font-family: "Noto Sans CJK JP", "IPAGothic", sans-serif; font-weight: bold; margin-left: 8px; }
.bubble { display: inline-block; position: relative; border: 2.5px solid #d0021b; border-radius: 14px;

           font-family: "Noto Sans CJK JP", "IPAGothic", sans-serif; }
.bubble::before { content: ""; position: absolute; top: -16px; left: 330px; border: 8px solid transparent;
                   border-bottom: 8px solid #d0021b; }
.bubrow { margin: 16px 0 0; }
.note { margin-top: 12px; font-size: 19px; color: #d0021b; font-family: "Noto Sans CJK JP", "IPAGothic", sans-serif; }
.good { outline: 3px solid #2e9e44; outline-offset: 4px; background: #f1faf2; }
.okwrap { position: relative; }
.check { position: absolute; right: -14px; top: -22px; }

<div class="toi3"><b>問３</b>　設問の登記がされると、土地の登記記録にはどのような記録がされるか簡潔に記載しなさい。</div>
<div class="toi3box"><span class="ink">本件土地（５番６）の登記記録の権利部甲区に、平野大輔の持分４分の３が敷地権である旨の登記がされる。また、権利部乙区の平野大輔の持分についての抵当権の登記（平成19年５月４日受付第13239号）は、建物の抵当権の登記と登記の目的・受付年月日・受付番号・登記原因及びその日付が同一であるため、職権で抹消される。</span></div>
<div class="caption">平成20年度 土地家屋調査士試験 第22問 問3 解答例</div>
